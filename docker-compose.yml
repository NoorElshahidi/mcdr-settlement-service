services:
  app:
    build: .
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 12
    env_file: .env
    environment:
      DB_HOST: db
      # .env's MINIO_ENDPOINT/CLAMAV_HOST default to localhost for host-side
      # `npm run start:dev`; inside the container that resolves to the app
      # container itself, not the sibling services, breaking uploads and virus
      # scanning. Override to the compose service DNS names.
      MINIO_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav
      # KEYCLOAK_ISSUER stays the browser-facing http://localhost:8080 URL (from
      # .env) because that's what Keycloak stamps into every token's `iss` claim
      # and what issuer validation must match. The API still needs a *reachable*
      # address to fetch JWKS/probe health server-to-server, so that goes in a
      # separate var pointed at the compose service name.
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/mcdr
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    command: ['node', './node_modules/typeorm/cli.js', '-d', 'dist/src/data-source.js', 'migration:run']
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '3001:3001'
    depends_on:
      app:
        condition: service_started
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-mcdr}
      MYSQL_USER: ${DB_USER:-mcdr}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mcdr}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u${DB_USER:-mcdr}', '-p${DB_PASSWORD:-mcdr}']
      interval: 5s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin12345}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin12345} && mc mb --ignore-existing local/${MINIO_BUCKET:-mcdr-documents} && mc anonymous set none local/${MINIO_BUCKET:-mcdr-documents}"
  clamav:
    image: clamav/clamav:1.4.6-debian13-slim
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1 2>/dev/null | grep -q PONG']
      interval: 10s
      timeout: 10s
      retries: 30
volumes:
  db_data:
  minio_data:
